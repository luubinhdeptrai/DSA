# ---- Server ----
# The port Spring Boot's embedded Tomcat listens on. Default is already 8080;
# written explicitly here so it's visible.
server.port=8080

# ---- Database connection ----
# Spring Boot uses these to build a JDBC connection pool (HikariCP by default)
# at startup. "taskdb" must already exist in PostgreSQL - Spring does not
# create the database itself, only (optionally) the tables inside it.
spring.datasource.url=jdbc:postgresql://localhost:5432/taskdb
spring.datasource.username=postgres
spring.datasource.password=postgres

# ---- JPA / Hibernate ----
# ddl-auto=update tells Hibernate: "look at my @Entity classes, compare them
# to the current database schema, and ALTER/CREATE tables to match."
# This is convenient for learning, but never used in production (see the
# GUIDE.md "Nice to know later" section for why - Flyway/Liquibase instead).
spring.jpa.hibernate.ddl-auto=update

# Prints every SQL statement Hibernate generates to the console. This is the
# single most useful setting for understanding what Hibernate is doing.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Which SQL dialect Hibernate should generate. Spring Boot can usually infer
# this from the driver, but it's spelled out here for clarity.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
