spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/book_catalog_flyway
    username: book_app
    password: replace-with-a-local-practice-password
    hikari:
      maximun-pool-size: 5
      minimun-idle: 2

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    validate-migration-naming: true
    baseline-on-migrate: false
    out-of-order: false
    clean-disabled: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format-sql: true

  sql:
    init:
      mode: never

logging:
  level:
    org.springframework.transaction: TRACE
    org.springframework.orm.jpa.JpaTransactionManager: DEBUG
    org.hibernate.SQL: DEBUG

server:
  address: 127.0.0.1
  port: 8080
