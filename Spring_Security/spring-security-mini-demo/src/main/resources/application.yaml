spring:
  application:
    name: spring-security-mini-demo

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/security_demo}
    username: ${DB_USERNAME:security_demo}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  flyway:
    enabled: true

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
